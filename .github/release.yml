# Configures GitHub's generated release notes (see "Create GitHub Release" in
# publish.yml). Every pull request to main carries exactly one release:* label,
# and releases that follow a twblazor release have no pull request at all, so
# these labels are excluded from the categories rather than used for them.
changelog:
  exclude:
    labels:
      - release:major
      - release:minor
      - release:patch
      - release:none
