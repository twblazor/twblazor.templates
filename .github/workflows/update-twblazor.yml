name: Update twblazor

# Releases twblazor.templates with the same version as each twblazor release.
#
# twblazor's "Publish Release Package" workflow sends a twblazor-release
# repository dispatch once its package is published. This workflow then:
#   1. waits for that twblazor version on NuGet.org,
#   2. syncs Theme.cs and the twblazor package references on main,
#   3. builds and tests, commits the update to main, and
#   4. starts "Publish Release" with that exact version.
#
# If twblazor.templates already has that version, or a later one, nothing is
# released. twblazor bumps from the higher of the two versions, so this only
# happens when a run is repeated. It can also be run by hand from
# Actions > Update twblazor > Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'twblazor version, for example 3.1.1. Leave blank for the latest stable release.'
        required: false
        type: string
  repository_dispatch:
    types: [twblazor-release]

permissions:
  contents: read

concurrency:
  group: update-twblazor
  cancel-in-progress: false

jobs:
  update:
    name: Sync twblazor and release the same version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # start publish.yml
    steps:
      # The twblazor-release app is on main's ruleset bypass list, so it can push
      # the update commit straight to main.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve twblazor version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${DISPATCH_VERSION:-}}"
          VERSION="${VERSION#v}"

          if [ -z "$VERSION" ]; then
            TAG="$(gh api repos/twblazor/twblazor/releases/latest --jq .tag_name)"
            VERSION="${TAG#v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a stable twblazor version such as 3.1.1."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved twblazor $VERSION."

      - name: Compare with the latest twblazor.templates release
        id: compare
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          LATEST="${LATEST#v}"
          echo "Latest twblazor.templates release: ${LATEST:-(none)}"

          if [ "$LATEST" = "$VERSION" ]; then
            echo "twblazor.templates is already released as $VERSION; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n 1)" = "$LATEST" ]; then
            echo "::warning::twblazor.templates $LATEST is ahead of twblazor $VERSION, so it was not released. twblazor's next release bumps past both versions."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing twblazor.templates $VERSION."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # NuGet.org can take a few minutes to list a newly pushed package, and the
      # template projects cannot restore until it does.
      - name: Wait for twblazor on NuGet.org
        if: steps.compare.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if curl -fsSL https://api.nuget.org/v3-flatcontainer/twblazor/index.json | jq -e --arg v "$VERSION" '.versions | index($v) != null' >/dev/null; then
              echo "twblazor $VERSION is on NuGet.org."
              exit 0
            fi
            echo "Waiting for twblazor $VERSION on NuGet.org ($attempt/120)..."
            sleep 30
          done
          echo "::error::twblazor $VERSION did not appear on NuGet.org within an hour. Re-run this workflow once it is listed."
          exit 1

      - name: Set up .NET
        if: steps.compare.outputs.release == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Update Theme.cs and package references
        if: steps.compare.outputs.release == 'true'
        shell: pwsh
        run: ./scripts/update-twblazor.ps1 -Version '${{ steps.version.outputs.version }}' -Ref '${{ steps.version.outputs.tag }}'

      - name: Restore
        if: steps.compare.outputs.release == 'true'
        run: dotnet restore TwBlazor.Templates.slnx

      - name: Build
        if: steps.compare.outputs.release == 'true'
        run: dotnet build TwBlazor.Templates.slnx -c Release --no-restore

      - name: Test
        if: steps.compare.outputs.release == 'true'
        run: dotnet test TwBlazor.Templates.slnx -c Release --no-build

      # [skip ci] stops this push from starting publish.yml by itself, which
      # would look for a release label on a pull request that does not exist.
      # The next step starts it with the exact version instead.
      - name: Commit the update to main
        if: steps.compare.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The templates already match twblazor $VERSION; releasing main as it is."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates preview
          git commit -m "chore: update twblazor to $VERSION. [skip ci]"
          git push origin HEAD:main

      - name: Start Publish Release
        if: steps.compare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
          echo "Started Publish Release for $VERSION. It waits for approval in the release environment."
