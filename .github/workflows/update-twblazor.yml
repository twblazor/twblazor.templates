name: Update twblazor

# Keeps the template's Theme.cs and package references aligned with the latest
# stable twblazor release. The generated app still gets a template snapshot:
# the update opens a reviewable PR, then the usual release workflow publishes
# a new twblazor.templates version after it is merged.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'twblazor version, for example 3.1.0. Leave blank for the latest stable release.'
        required: false
        type: string
  repository_dispatch:
    types: [twblazor-release]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-twblazor
  cancel-in-progress: false

jobs:
  update:
    name: Sync the theme and package references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve twblazor version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${DISPATCH_VERSION:-}}"
          VERSION="${VERSION#v}"

          if [ -z "$VERSION" ]; then
            TAG="$(gh api repos/twblazor/twblazor/releases/latest --jq .tag_name)"
            VERSION="${TAG#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a twblazor version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved twblazor $VERSION."

      - name: Update Theme.cs and package references
        shell: pwsh
        run: ./scripts/update-twblazor.ps1 -Version '${{ steps.version.outputs.version }}' -Ref '${{ steps.version.outputs.tag }}'

      - name: Restore
        run: dotnet restore TwBlazor.Templates.slnx

      - name: Build
        run: dotnet build TwBlazor.Templates.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TwBlazor.Templates.slnx -c Release --no-build

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The templates already match twblazor ${{ steps.version.outputs.version }}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="chore/twblazor-$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add templates preview
          git commit -m "chore: update twblazor to $VERSION"
          git push --force origin "$BRANCH"

          BODY="Updates the template Theme.cs and package references to twblazor $VERSION. The update workflow built and tested this branch."

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --add-label release:patch
          elif gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "chore: update twblazor to $VERSION" \
              --body "$BODY" \
              --label release:patch; then
            echo "Opened the update pull request."
          else
            COMPARE_URL="https://github.com/$GITHUB_REPOSITORY/compare/develop...$BRANCH?expand=1"
            VERSION_TITLE="chore: update twblazor to $VERSION"
            EXISTING_ISSUE="$(GH_TOKEN="$FALLBACK_TOKEN" gh issue list --state open --limit 100 --json title --jq '.[] | select(.title == env.VERSION_TITLE) | .number' | head -n 1)"
            if [ -z "$EXISTING_ISSUE" ]; then
              GH_TOKEN="$FALLBACK_TOKEN" gh issue create \
                --title "$VERSION_TITLE" \
                --body "The update workflow built and tested a branch that updates Theme.cs and the package references to twblazor $VERSION. Open the pull request from $COMPARE_URL." || true
            fi
            echo "::warning::Could not open the pull request. Open it from $COMPARE_URL"
          fi
