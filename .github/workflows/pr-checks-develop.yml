name: PR Checks (develop)

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  build-and-test:
    name: Build and Test (PR to develop)
    uses: ./.github/workflows/build-and-test.yml
    with:
      configuration: Release


