name: Build and Test (Reusable)

on:
  workflow_call:
    inputs:
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Configure GitHub Packages for a preview twblazor package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $project = Get-Content templates/twblazor/host/TwBlazorApp.csproj -Raw
          $match = [regex]::Match($project, '<PackageReference[^>]*Include="twblazor"[^>]*Version="([^"]+)"')
          if (-not $match.Success) {
              throw "Could not find the twblazor PackageReference in the template host project."
          }

          if ($match.Groups[1].Value -notmatch '-') {
              Write-Host "The template uses a stable twblazor package; GitHub Packages is not needed."
              exit 0
          }

          dotnet nuget add source "https://nuget.pkg.github.com/TwBlazor/index.json" `
              --name github-packages `
              --username "${{ github.actor }}" `
              --password "$env:GITHUB_TOKEN" `
              --store-password-in-clear-text

      - name: Restore
        run: dotnet restore TwBlazor.Templates.slnx

      - name: Build
        run: dotnet build TwBlazor.Templates.slnx -c ${{ inputs.configuration }} --no-restore

      - name: Test
        run: dotnet test TwBlazor.Templates.slnx -c ${{ inputs.configuration }} --no-build


