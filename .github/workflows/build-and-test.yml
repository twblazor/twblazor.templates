name: Build and Test (Reusable)

on:
  workflow_call:
    inputs:
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TwBlazor.Templates.slnx

      - name: Build
        run: dotnet build TwBlazor.Templates.slnx -c ${{ inputs.configuration }} --no-restore

      - name: Test
        run: dotnet test TwBlazor.Templates.slnx -c ${{ inputs.configuration }} --no-build


